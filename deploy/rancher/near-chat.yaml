apiVersion: v1
kind: Namespace
metadata:
  name: near-chat
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: near-chat-config
  namespace: near-chat
data:
  APP_PORT: "3000"
  JWT_EXPIRES_IN: "7d"
  MINIO_ENDPOINT: "minio.storage.svc.cluster.local"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: "near-chat-files"
  FILE_MAX_BYTES: "52428800"
  AVATAR_MAX_BYTES: "8388608"
  FILE_USER_QUOTA_BYTES: "1073741824"
  FILE_ORPHAN_TTL_HOURS: "24"
  FILE_CLEANUP_INTERVAL_MINUTES: "30"
  STORAGE_RETRY_ATTEMPTS: "3"
  MESSAGE_RECALL_WINDOW_SECONDS: "120"
  SEED_DEMO_USERS: "false"
  # 这些值只引导首次建库；部署后由管理员在 NearChat 界面中维护。
  AI_ENABLED: "false"
  AI_BASE_URL: ""
  AI_CHAT_MODEL: ""
  AI_EMBEDDING_MODEL: ""
  AI_EMBEDDING_DIMENSIONS: "1536"
  AI_KNOWLEDGE_CHUNK_SIZE: "1200"
  AI_KNOWLEDGE_CHUNK_OVERLAP: "180"
---
apiVersion: v1
kind: Secret
metadata:
  name: near-chat-secret
  namespace: near-chat
type: Opaque
stringData:
  DATABASE_URL: "postgres://near_chat:CHANGE_ME@postgres.database.svc.cluster.local:5432/near_chat"
  JWT_SECRET: "CHANGE_ME_WITH_AT_LEAST_32_RANDOM_BYTES"
  MINIO_ACCESS_KEY: "CHANGE_ME"
  MINIO_SECRET_KEY: "CHANGE_ME"
  SEED_ADMIN_PASSWORD: "CHANGE_ME"
  # 必须长期保持不变，否则数据库中已保存的模型密钥将无法解密。
  AI_SETTINGS_ENCRYPTION_KEY: "CHANGE_ME"
  AI_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: near-chat
  namespace: near-chat
  labels:
    app.kubernetes.io/name: near-chat
spec:
  # 在线状态和 WebSocket 广播保存在当前进程中，现阶段固定为单副本。
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: near-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: near-chat
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: near-chat
          image: near-chat-app:1.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: near-chat-config
            - secretRef:
                name: near-chat-secret
          startupProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: near-chat
  namespace: near-chat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: near-chat
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: near-chat
  namespace: near-chat
  annotations:
    # 预留 multipart 边界开销，应用内部仍严格限制单文件 50 MiB。
    nginx.ingress.kubernetes.io/proxy-body-size: "55m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: near-chat.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: near-chat
                port:
                  number: 3000
